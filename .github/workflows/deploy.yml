name: Deploy Sensus Landing & Deep Links

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-sensus-landing
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. DEVSECOPS SECURITY & INTEGRITY GATE (Bloqueante)
  # =========================================================================
  security-gate:
    name: 🛡️ Pre-Deploy Security Gate
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Escaneo de secretos
      - name: 🔒 Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verificación de integridad de Android App Links
      - name: 📱 Validar public/.well-known/assetlinks.json
        run: |
          python3 -c "
          import json
          with open('public/.well-known/assetlinks.json') as f:
              data = json.load(f)
              assert len(data) > 0, 'assetlinks.json está vacío'
              target = data[0].get('target', {})
              assert target.get('package_name') == 'sensus.com', 'Package name inválido'
              assert len(target.get('sha256_cert_fingerprints', [])) > 0, 'Falta huella SHA-256'
          print('✅ assetlinks.json validado formalmente')
          "

      # Verificación de URLs legales obligatorias por Google Play
      - name: ⚖️ Validar páginas legales requeridas por Google Play
        run: |
          test -f public/privacidad.html || (echo '❌ Falta public/privacidad.html' && exit 1)
          test -f public/eliminar-cuenta.html || (echo '❌ Falta public/eliminar-cuenta.html' && exit 1)
          test -f public/index.html || (echo '❌ Falta public/index.html' && exit 1)
          test -f public/reset/index.html || (echo '❌ Falta public/reset/index.html' && exit 1)
          echo "✅ Todas las páginas legales y de recuperación están presentes."

      # Auditoría de dependencias en el prototipo interactivo (app-vite-sensus)
      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app-vite-sensus/package-lock.json'

      - name: 📦 Instalar dependencias y auditar SCA (app-vite-sensus)
        working-directory: ./app-vite-sensus
        run: |
          npm ci
          npm audit --audit-level=high

  # =========================================================================
  # 2. DESPLIEGUE A HOSTING NEUBOX (FTP Seguro a /public_html/sensus/)
  # =========================================================================
  deploy:
    name: 🚀 Despliegue seguro a Neubox
    needs: [security-gate]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      # =====================================================================
      # SUBIDA DE LA LANDING A /public_html/sensus/
      # Aislamiento total: Solo sube a /sensus/ sin tocar la raíz de rodnix.com.mx
      # =====================================================================
      - name: 🌐 Subir Landing Page a /public_html/sensus/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 300000
          local-dir: ./public/
          server-dir: /public_html/sensus/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .well-known/**

      # =====================================================================
      # SUBIDA DE ASSETLINKS A /public_html/.well-known/ (Android App Links)
      # =====================================================================
      - name: 📱 Subir Android Asset Links a /public_html/.well-known/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 300000
          local-dir: ./public/.well-known/
          server-dir: /public_html/.well-known/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
