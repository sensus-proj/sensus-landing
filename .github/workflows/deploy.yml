name: Deploy Sensus Landing & Deep Links

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-sensus-landing
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. GATE DE SECRETOS Y CREDENCIALES (Gitleaks & TruffleHog)
  # =========================================================================
  secrets-gate:
    name: '🔒 Compuerta 1: Escaneo de Secretos'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 🔒 Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐕 TruffleHog OSS Secret Scanner
        uses: trufflesecurity/trufflehog@f8221ca52ac51bf66228d6ec3691f3ea0782ae15 # main
        with:
          path: ./
          extra_args: --only-verified

  # =========================================================================
  # 2. GATE DE DEPENDENCIAS Y SCA (npm audit en raíz y app-vite-sensus)
  # =========================================================================
  sca-gate:
    name: '📦 Compuerta 2: Auditoría de Dependencias (SCA)'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app-vite-sensus/package-lock.json

      - name: 📦 Instalar dependencias raíz y auditar vulnerabilidades
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: 📦 Instalar dependencias app-vite-sensus y auditar vulnerabilidades
        working-directory: ./app-vite-sensus
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  # =========================================================================
  # 3. GATE DE CALIDAD, LINTING, PRUEBAS Y COMPILACIÓN (Landing + Vite React)
  # =========================================================================
  quality-gate:
    name: '🧪 Compuerta 3: Calidad, Linting, Pruebas y Compilación'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app-vite-sensus/package-lock.json

      - name: 📦 Instalar dependencias raíz
        run: npm ci --ignore-scripts

      - name: 🔍 Linting e integridad de assets estáticos
        run: npm run lint

      - name: 🧪 Ejecutar pruebas unitarias (Node Test Runner)
        run: npm run test:unit

      - name: 🏗️ Compilar Landing Page y parciales (build.js)
        run: npm run build

      - name: 🔍 Re-verificación de assets post-build
        run: node scripts/check-assets.js

      - name: ⚛️ Compilación y chequeo de tipos en app-vite-sensus (TypeScript + Vite)
        working-directory: ./app-vite-sensus
        run: |
          npm ci --ignore-scripts
          npm run type-check
          npm run build

  # =========================================================================
  # 4. GATE DE INTEGRIDAD DE PLATAFORMA Y POLÍTICAS GOOGLE PLAY
  # =========================================================================
  integrity-gate:
    name: '📱 Compuerta 4: Integridad Criptográfica y Google Play'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🐍 Configurar Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: 📱 Ejecutar verificación de cumplimiento de assetlinks y páginas legales
        run: python3 scripts/verify-compliance.py

  # =========================================================================
  # 5. GATE DE SUITES DEVSECOPS EXTERNAS Y SONARCLOUD (Bloqueante Estricto)
  # =========================================================================
  sonar-and-devsecops-gate:
    name: '🛡️ Compuerta 5: Validación de SonarCloud y Suites DevSecOps'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: 🛡️ Verificar que todas las suites y SonarCloud Quality Gate hayan pasado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/verify-deployment-gates.js

  # =========================================================================
  # 6. DESPLIEGUE A PRODUCCIÓN NEUBOX (EXCLUSIVO TRAS APROBAR TODAS LAS COMPUERTAS)
  # =========================================================================
  deploy:
    name: 🚀 Despliegue seguro a Neubox
    needs: [secrets-gate, sca-gate, quality-gate, integrity-gate, sonar-and-devsecops-gate]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: 🏗️ Compilar Landing Page limpia para producción
        run: |
          npm ci --ignore-scripts
          npm run build
          node scripts/check-assets.js

      # =====================================================================
      # SUBIDA DE LA LANDING A /public_html/sensus/
      # Aislamiento total: Solo sube a /sensus/ sin tocar la raíz de rodnix.com.mx
      # =====================================================================
      - name: 🌐 Subir Landing Page a /public_html/sensus/
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 300000
          local-dir: ./public/
          server-dir: /public_html/sensus/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .well-known/**

      # =====================================================================
      # SUBIDA DE ASSETLINKS A /public_html/.well-known/ (Android App Links)
      # =====================================================================
      - name: 📱 Subir Android Asset Links a /public_html/.well-known/
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 300000
          local-dir: ./public/.well-known/
          server-dir: /public_html/.well-known/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
