name: Deploy Sensus Landing & Deep Links

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-sensus-landing
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. GATE DE SECRETOS Y CREDENCIALES (Gitleaks & TruffleHog)
  # =========================================================================
  secrets-gate:
    name: 🔒 Compuerta 1: Escaneo de Secretos
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔒 Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐕 TruffleHog OSS Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          head: ${{ github.sha }}
          extra_args: --only-verified

  # =========================================================================
  # 2. GATE DE DEPENDENCIAS Y SCA (npm audit en raíz y app-vite-sensus)
  # =========================================================================
  sca-gate:
    name: 📦 Compuerta 2: Auditoría de Dependencias (SCA)
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app-vite-sensus/package-lock.json

      - name: 📦 Instalar dependencias raíz y auditar vulnerabilidades
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: 📦 Instalar dependencias app-vite-sensus y auditar vulnerabilidades
        working-directory: ./app-vite-sensus
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  # =========================================================================
  # 3. GATE DE CALIDAD, LINTING, PRUEBAS Y COMPILACIÓN (Landing + Vite React)
  # =========================================================================
  quality-gate:
    name: 🧪 Compuerta 3: Calidad, Linting, Pruebas y Compilación
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app-vite-sensus/package-lock.json

      - name: 📦 Instalar dependencias raíz
        run: npm ci --ignore-scripts

      - name: 🔍 Linting e integridad de assets estáticos
        run: npm run lint

      - name: 🧪 Ejecutar pruebas unitarias (Node Test Runner)
        run: npm run test:unit

      - name: 🏗️ Compilar Landing Page y parciales (build.js)
        run: npm run build

      - name: 🔍 Re-verificación de assets post-build
        run: node scripts/check-assets.js

      - name: ⚛️ Compilación y chequeo de tipos en app-vite-sensus (TypeScript + Vite)
        working-directory: ./app-vite-sensus
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm run build

  # =========================================================================
  # 4. GATE DE INTEGRIDAD DE PLATAFORMA Y POLÍTICAS GOOGLE PLAY
  # =========================================================================
  integrity-gate:
    name: 📱 Compuerta 4: Integridad Criptográfica y Google Play
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📱 Ejecutar verificación de cumplimiento de assetlinks y páginas legales
        run: python3 scripts/verify-compliance.py

  # =========================================================================
  # 5. DESPLIEGUE A PRODUCCIÓN NEUBOX (EXCLUSIVO TRAS APROBAR TODAS LAS COMPUERTAS)
  # =========================================================================
  deploy:
    name: 🚀 Despliegue seguro a Neubox
    needs: [secrets-gate, sca-gate, quality-gate, integrity-gate]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🏗️ Compilar Landing Page limpia para producción
        run: |
          npm ci --ignore-scripts
          npm run build
          node scripts/check-assets.js

      # =====================================================================
      # SUBIDA DE LA LANDING A /public_html/sensus/
      # Aislamiento total: Solo sube a /sensus/ sin tocar la raíz de rodnix.com.mx
      # =====================================================================
      - name: 🌐 Subir Landing Page a /public_html/sensus/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 300000
          local-dir: ./public/
          server-dir: /public_html/sensus/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .well-known/**

      # =====================================================================
      # SUBIDA DE ASSETLINKS A /public_html/.well-known/ (Android App Links)
      # =====================================================================
      - name: 📱 Subir Android Asset Links a /public_html/.well-known/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 300000
          local-dir: ./public/.well-known/
          server-dir: /public_html/.well-known/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
