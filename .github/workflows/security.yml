name: DevSecOps Security Audit

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Cada lunes a las 04:00 UTC
  workflow_dispatch:

jobs:
  security-audit:
    name: 🛡️ Análisis Estático y Auditoría
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 🔒 Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app-vite-sensus/package-lock.json'

      - name: 📦 Auditoría de Dependencias (SCA)
        working-directory: ./app-vite-sensus
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: 🐍 Configurar Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: 📱 Validar sintaxis, permisos y huellas .well-known/assetlinks.json
        run: python3 scripts/verify-compliance.py
