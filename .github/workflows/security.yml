name: DevSecOps Security Audit

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Cada lunes a las 04:00 UTC
  workflow_dispatch:

jobs:
  security-audit:
    name: 🛡️ Análisis Estático y Auditoría
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔒 Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app-vite-sensus/package-lock.json'

      - name: 📦 Auditoría de Dependencias (SCA)
        working-directory: ./app-vite-sensus
        run: |
          npm ci
          npm audit --audit-level=high

      - name: 📱 Validar sintaxis y permisos .well-known/assetlinks.json
        run: |
          python3 -c "
          import json, re
          with open('public/.well-known/assetlinks.json') as f:
              data = json.load(f)
              assert len(data) > 0, 'assetlinks.json está vacío'
              entry = data[0]
              relations = entry.get('relation', [])
              assert 'delegate_permission/common.handle_all_urls' in relations, 'Falta permiso handle_all_urls'
              assert 'delegate_permission/common.get_login_creds' in relations, 'Falta permiso get_login_creds'
              target = entry.get('target', {})
              assert target.get('namespace') == 'android_app', 'Namespace debe ser android_app'
              assert target.get('package_name') == 'sensus.com', 'Package name inválido'
              fingerprints = target.get('sha256_cert_fingerprints', [])
              assert len(fingerprints) > 0, 'Falta huella SHA-256'
              pattern = re.compile(r'^([0-9A-F]{2}:){31}[0-9A-F]{2}$')
              for fp in fingerprints:
                  assert pattern.match(fp), f'Formato SHA-256 inválido: {fp}'
          print('✅ assetlinks.json validado formalmente con permisos y huellas')
          "
